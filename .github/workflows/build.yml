name: Build SkidSuite JAR

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  # 允许手动触发工作流
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 检出代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 设置 JDK
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        # 缓存 Gradle 依赖，加速后续构建
        cache: gradle

    # 3. 赋予 gradlew 执行权限 (重要)
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. 执行 Gradle 构建命令
    - name: Build with Gradle
      run: ./gradlew build fatJar

    # 5. 上传生成的 JAR 文件作为构建产物
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: SkidSuite-JAR
        # 根据项目说明，构建产物位于 builds/libs 目录[reference:1]
        path: builds/libs/*.jar
